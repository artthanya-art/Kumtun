<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>บทความ — คุ้มทุน</title>
<meta name="description" content="บทความความรู้เรื่องการประหยัดพลังงานและทรัพยากร จากคุ้มทุน" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#EEF2EC; --paper-raised:#FBFCFA; --ink:#182620; --ink-soft:#4E5D54; --ink-faint:#8A968D;
    --line:#C9D2C9; --line-soft:#DEE5DC; --primary:#1F6F54; --primary-dark:#134637; --primary-soft:#DCEBE1;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;}
  .wrap{max-width:860px;margin:0 auto;padding:0 24px;}
  a{color:var(--primary-dark);}

  header{border-bottom:1px solid var(--line);background:var(--paper-raised);}
  header .bar{display:flex;align-items:center;justify-content:space-between;height:64px;}
  .brand{font-family:'Fraunces',serif;font-weight:700;font-size:20px;}
  .brand .tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);border-left:1px solid var(--line);padding-left:8px;margin-left:8px;}
  .back-link{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--primary-dark);text-decoration:none;}
  .back-link:hover{text-decoration:underline;}

  .hero{padding:44px 0 8px;}
  .hero h1{font-family:'Fraunces',serif;font-size:clamp(28px,5vw,40px);font-weight:600;margin:0 0 10px;}
  .hero p{color:var(--ink-soft);font-size:15px;max-width:560px;margin:0 0 28px;}

  /* -------- list view -------- */
  .article-grid{display:flex;flex-direction:column;gap:16px;margin-bottom:60px;}
  .article-card{
    display:block;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 24px;text-decoration:none;color:inherit;transition:.15s;
  }
  .article-card:hover{border-color:var(--primary);box-shadow:0 2px 10px rgba(31,111,84,.08);}
  .article-card .date{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-faint);margin-bottom:8px;}
  .article-card h2{font-family:'Fraunces',serif;font-size:21px;font-weight:600;margin:0 0 8px;color:var(--ink);}
  .article-card .excerpt{font-size:14px;color:var(--ink-soft);line-height:1.6;margin:0;}
  .article-card .read-more{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--primary-dark);}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-faint);font-size:14px;
    border:1px dashed var(--line);border-radius:var(--radius);margin-bottom:60px;
  }

  /* -------- detail view -------- */
  .article-detail{margin-bottom:60px;}
  .article-detail .date{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-faint);margin-bottom:10px;}
  .article-detail h1{font-family:'Fraunces',serif;font-size:clamp(26px,4.5vw,36px);font-weight:600;margin:0 0 20px;line-height:1.25;}
  .article-detail .cover{width:100%;border-radius:var(--radius);margin-bottom:24px;display:block;}
  .article-body{font-size:16px;line-height:1.85;color:var(--ink);}
  .article-body p{margin:0 0 18px;}
  .article-body h2{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin:32px 0 14px;}
  .article-body h3{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:26px 0 12px;}
  .article-body ul, .article-body ol{margin:0 0 18px;padding-left:22px;}
  .article-body li{margin-bottom:6px;}
  .article-body img{max-width:100%;border-radius:10px;margin:8px 0;}
  .article-body a{color:var(--primary-dark);}
  .article-body strong{color:var(--ink);}
  .article-body blockquote{
    border-left:3px solid var(--primary);margin:20px 0;padding:2px 0 2px 18px;color:var(--ink-soft);font-style:italic;
  }

  footer{border-top:1px solid var(--line);padding:26px 0 40px;margin-top:20px;}
  footer p{font-size:12px;color:var(--ink-faint);line-height:1.7;max-width:640px;}

  @media (max-width:480px){
    .wrap{padding:0 16px;}
    .article-card{padding:18px;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="brand">คุ้มทุน<span style="color:var(--primary)">.</span><span class="tag">บทความ</span></div>
    <a class="back-link" href="index.html">← กลับไปเครื่องคำนวณ</a>
  </div>
</header>

<div class="wrap">
  <div id="content"></div>
</div>

<footer>
  <div class="wrap">
    <p>บทความทั้งหมดเขียนขึ้นเพื่อให้ความรู้ทั่วไปเกี่ยวกับการประหยัดพลังงานและทรัพยากรเท่านั้น ไม่ใช่คำแนะนำทางการเงินหรือวิศวกรรมเฉพาะกรณี ควรปรึกษาผู้เชี่ยวชาญก่อนตัดสินใจลงทุนจริง</p>
  </div>
</footer>

<script>
(function(){

  function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

  function formatDate(iso){
    if(!iso) return '';
    try{
      const d = new Date(iso+'T00:00:00');
      return d.toLocaleDateString('th-TH', {year:'numeric', month:'long', day:'numeric'});
    }catch(e){ return iso; }
  }

  function renderList(articles){
    const el = document.getElementById('content');
    const sorted = articles.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    if(sorted.length===0){
      el.innerHTML = [
        '<div class="hero"><h1>บทความ</h1><p>ความรู้เรื่องการประหยัดพลังงานและทรัพยากร อัปเดตเรื่อยๆ</p></div>',
        '<div class="empty-state">ยังไม่มีบทความในขณะนี้ — กลับมาดูใหม่เร็วๆ นี้</div>'
      ].join('');
      return;
    }
    el.innerHTML = [
      '<div class="hero"><h1>บทความ</h1><p>ความรู้เรื่องการประหยัดพลังงานและทรัพยากร อัปเดตเรื่อยๆ</p></div>',
      '<div class="article-grid">',
      sorted.map(a=>
        '<a class="article-card" href="#'+encodeURIComponent(a.id)+'">'+
          '<div class="date">'+formatDate(a.date)+'</div>'+
          '<h2>'+(a.title||'ไม่มีชื่อบทความ')+'</h2>'+
          (a.excerpt ? '<p class="excerpt">'+a.excerpt+'</p>' : '')+
          '<span class="read-more">อ่านต่อ →</span>'+
        '</a>'
      ).join(''),
      '</div>'
    ].join('');
  }

  function renderDetail(article){
    const el = document.getElementById('content');
    el.innerHTML = [
      '<div class="article-detail">',
        '<div style="margin:24px 0 18px;"><a class="back-link" href="#">← กลับไปหน้ารวมบทความ</a></div>',
        '<div class="date">'+formatDate(article.date)+'</div>',
        '<h1>'+(article.title||'ไม่มีชื่อบทความ')+'</h1>',
        (article.coverImage ? '<img class="cover" src="'+article.coverImage+'" alt="'+escapeAttr(article.title)+'"/>' : ''),
        '<div class="article-body">'+(article.content||'')+'</div>',
      '</div>'
    ].join('');
    window.scrollTo(0,0);
  }

  function route(articles){
    const hash = decodeURIComponent(location.hash.replace(/^#/,''));
    if(hash){
      const found = articles.find(a=> a.id===hash);
      if(found){ renderDetail(found); return; }
    }
    renderList(articles);
  }

  let allArticles = [];
  fetch('articles-config.json', {cache:'no-store'})
    .then(r=> r.ok ? r.json() : {articles:[]})
    .then(cfg=>{
      allArticles = Array.isArray(cfg.articles) ? cfg.articles : [];
      route(allArticles);
    })
    .catch(()=>{
      document.getElementById('content').innerHTML =
        '<div class="hero"><h1>บทความ</h1></div><div class="empty-state">ไม่สามารถโหลดบทความได้ในขณะนี้</div>';
    });

  window.addEventListener('hashchange', ()=> route(allArticles));
})();
</script>
</body>
</html>
